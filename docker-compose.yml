services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    # Host networking is the recommended mode for Home Assistant on Linux:
    # it lets local discovery protocols (mDNS/SSDP) reach the LAN, and makes
    # HA see the real source IP of incoming requests (needed by trusted_proxies).
    network_mode: host
    volumes:
      - ./config:/config
      - /run/dbus:/run/dbus:ro
      - /etc/localtime:/etc/localtime:ro
    devices:
      # Native USB passthrough: no ser2net bridge needed on Linux.
      # The by-id path is stable across reboots and re-enumeration.
      - ${ZIGBEE_DEVICE}:/dev/ttyUSB0
    cap_add:
      # Required by habluetooth for the Pi's onboard Bluetooth adapter.
      # Note these are necessary but NOT sufficient: the adapter must also be
      # powered on at the host (hci0 UP), or HA still raises a PermissionError.
      # See docs/operations.md.
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=${TZ:-Europe/Paris}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    # Bridge networking with explicit port publishing (unlike Home Assistant's
    # host mode): Pi-hole doesn't need mDNS/SSDP or the real client source IP,
    # and host mode would put its own port 80 in direct conflict with anything
    # else on the Pi. Only DNS (53) and the admin web UI (80) are exposed.
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
    environment:
      - TZ=${TZ:-Europe/Paris}
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD}
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
